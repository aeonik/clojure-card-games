# Add inside the dc3systems.com HTTPS VirtualHost.
# Apache 2.4.47+ can proxy WebSocket upgrades through mod_proxy_http.
# Requires mod_proxy, mod_proxy_http, mod_headers, and mod_reqtimeout.

RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
LimitRequestBody 16384
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

Header always set X-Content-Type-Options "nosniff" "expr=%{REQUEST_URI} =~ m#^/karbosh(?:/|$)#"
Header always set Referrer-Policy "no-referrer" "expr=%{REQUEST_URI} =~ m#^/karbosh(?:/|$)#"
Header always set X-Frame-Options "DENY" "expr=%{REQUEST_URI} =~ m#^/karbosh(?:/|$)#"
Header onsuccess unset Content-Security-Policy "expr=%{REQUEST_URI} =~ m#^/karbosh(?:/|$)#"
Header always unset Content-Security-Policy "expr=%{REQUEST_URI} =~ m#^/karbosh(?:/|$)#"
Header always set Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; media-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" "expr=%{REQUEST_URI} =~ m#^/karbosh(?:/|$)#"

ProxyPass "/karbosh/ws" "http://127.0.0.1:8090/karbosh/ws" upgrade=websocket
ProxyPassReverse "/karbosh/ws" "http://127.0.0.1:8090/karbosh/ws"
ProxyPass "/karbosh/admin" "http://127.0.0.1:8090/karbosh/admin"
ProxyPassReverse "/karbosh/admin" "http://127.0.0.1:8090/karbosh/admin"
ProxyPass "/karbosh/api/" "http://127.0.0.1:8090/karbosh/api/"
ProxyPassReverse "/karbosh/api/" "http://127.0.0.1:8090/karbosh/api/"
